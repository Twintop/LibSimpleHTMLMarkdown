name: Tests

# Renders every test document (tests/run_tests.py) under Lua 5.1, the version WoW runs, and checks that the
# output is markup SimpleHTML can parse and matches tests/golden/. Release tags run the same tests in release.yml
# before packaging.

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    name: Render and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lupa (Python bindings that bundle Lua 5.1)
        run: pip install "lupa>=2,<3"

      - name: Run the tests
        run: python tests/run_tests.py

      - name: Require Demo.lua and Showcase.lua to be commented out
        run: python tests/check_release_files.py
