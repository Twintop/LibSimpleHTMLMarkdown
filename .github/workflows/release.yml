name: Release

# Tags are <MAJOR>.0.<MINOR>, after the LibStub version in LibSimpleHTMLMarkdown.lua: "LibSimpleHTMLMarkdown-1.0"
# with MARKDOWN10_MINOR = 1 is tag 1.0.1. The TOC's "## Version:" must carry the same value. Every tag runs this
# workflow, so a tag in any other shape fails the check instead of being skipped.
# The packager then creates the GitHub release, attaches its zip, and uploads to CurseForge and Wago using the
# X-Curse-Project-ID and X-Wago-ID lines in the TOC. Its changelog is the tag's section of CHANGELOG.md.

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Check and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to match the library and TOC versions
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          LUA="LibSimpleHTMLMarkdown.lua"
          TOC="LibSimpleHTMLMarkdown.toc"
          MAJOR="$(tr -d '\r' < "$LUA" | sed -nE 's/^local[[:space:]]+MARKDOWN10[[:space:]]*=[[:space:]]*"LibSimpleHTMLMarkdown-([0-9]+)\.0".*/\1/p' | head -n 1)"
          MINOR="$(tr -d '\r' < "$LUA" | sed -nE 's/^local[[:space:]]+MARKDOWN10_MINOR[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' | head -n 1)"
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ]; then echo "Could not read MARKDOWN10 and MARKDOWN10_MINOR from $LUA"; exit 1; fi
          LIB_VERSION="$MAJOR.0.$MINOR"
          TOC_VERSION="$(tr -d '\r' < "$TOC" | sed -n 's/^\xEF\xBB\xBF//; s/^## Version:[[:space:]]*//p' | head -n 1 | sed 's/[[:space:]]*$//')"
          status=0
          if [ "$TAG" != "$LIB_VERSION" ]; then
            echo "Tag $TAG does not match $LUA (LibSimpleHTMLMarkdown-$MAJOR.0 minor $MINOR is $LIB_VERSION)."
            status=1
          fi
          if [ "$TAG" != "$TOC_VERSION" ]; then
            echo "Tag $TAG does not match $TOC (## Version: $TOC_VERSION)."
            status=1
          fi
          if [ $status -ne 0 ]; then
            echo "Set MARKDOWN10_MINOR and the TOC version to the release, commit, and tag that commit."
            exit 1
          fi
          echo "$LUA and $TOC are both $TAG"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests
        run: |
          pip install "lupa>=2,<3"
          python tests/run_tests.py

      - name: Cut CHANGELOG.md down to the tag's section
        shell: bash
        run: |
          # The "## <tag>" section, up to the next "## " heading. Blank lines are only printed ahead of content,
          # so the section's trailing blanks drop.
          SECTION="$(tr -d '\r' < CHANGELOG.md | awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; found = ($2 == tag) }
            found { if ($0 ~ /^[[:space:]]*$/) { blank++ } else { for (; blank > 0; blank--) print ""; print } }')"
          if [ -z "$SECTION" ]; then echo "CHANGELOG.md has no \"## $GITHUB_REF_NAME\" section"; exit 1; fi
          echo "$SECTION" > CHANGELOG.md
          cat CHANGELOG.md

      - name: Package and upload with the BigWigs packager
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
